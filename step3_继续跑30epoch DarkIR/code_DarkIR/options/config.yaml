network:
  name: "DarkIR"
  img_channels: 3
  width: 64
  middle_blk_num_enc: 1
  middle_blk_num_dec: 1
  enc_blk_nums: [2,2,4]
  dec_blk_nums: [2,2,2]
  dilations: [1,2,3]
  extra_depth_wise: False

train:
  epochs: 30
  lr_initial: 0.00001    # 降低学习率避免震荡
  weight_decay: 0.00001
  betas: [0.9, 0.999]
  lr_scheme: "CosineAnnealing"
  eta_min: 0.000001
  resume: true
  loss:
    # Pixel / L1 loss
    pixel_criterion: "l1"
    pixel_weight: 1.0        # λp

    # Perceptual loss (LPIPS)
    perceptual: true
    perceptual_weight: 0.1   # λpe - 增加以更好约束感知质量
    perceptual_criterion: "lpips"   # 使用LPIPS作为感知损失
    perceptual_model: "vgg19"       # 论文中基于VGG19
    perceptual_reduction: "mean"

    # Edge loss
    edge: true
    edge_weight: 5.0         # λed - 降低避免过度强调边缘
    edge_criterion: "l2"     # 论文里是梯度L2
    edge_reduction: "mean"

    # Frequency loss
    frequency: false          # 论文没用，可以关掉
    frequency_weight: 1.0
    frequency_criterion: "l1"
    frequency_reduction: "mean"

    # Enhance / LOL guiding loss
    enhance: true
    enhance_weight: 0.5       # 降低权重以平衡各损失
    enhance_criterion: "l1"  # 同论文Llol: L1 + LPIPS
    enhance_reduction: "mean"


datasets:
  name: "LOLBlur"
  train:
    name: "LOLBlur_Train"
    dataroot: "/root/autodl-tmp/LOL-Blur/train"
    batch_size: 1
    shuffle: true
    verbose: true
    n_workers: 4
  val:
    name: "LOLBlur_Val"
    dataroot: "/root/autodl-tmp/LOL-Blur/val"
    batch_size: 1
    shuffle: false
    verbose: true
    n_workers: 4


path:
  save_dir: './experiments/checkpoints'
  resume_path: './experiments/checkpoints/baseline_best_psnr.pt'
